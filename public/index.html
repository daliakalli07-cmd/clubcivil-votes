<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Club Scientifique - Comment as-tu connu ?</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body>
  <!-- Fond particles -->
  <div id="particles-js"></div>

  <div class="container">
    <h1>Comment as-tu connu notre club ?</h1>
    <div class="buttons">
      <button class="btn" data-source="Réseau social">Réseau social</button>
      <button class="btn" data-source="Amis">Amis</button>
      <button class="btn" data-source="Salon">Salon</button>
      <button class="btn" data-source="Section">Section</button>
      <button class="btn purple" data-source="Autre">Autre</button>
    </div>

    <h2>Statistiques :</h2>
    <div id="stats" class="stats-cards">
      <div class="stat-card">Réseau social : <span>0</span></div>
      <div class="stat-card">Amis : <span>0</span></div>
      <div class="stat-card">Salon : <span>0</span></div>
      <div class="stat-card">Section : <span>0</span></div>
      <div class="stat-card">Autre : <span>0</span></div>
    </div>

    <div class="logo">
      <img src="images/LOGO.png" alt="Logo" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
